services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lotg
      POSTGRES_PASSWORD: lotg
      POSTGRES_DB: lotg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotg -d lotg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
